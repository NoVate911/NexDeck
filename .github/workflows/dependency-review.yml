name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          # Проверенные зависимости (MIT / Apache-2.0 / BSD-3-Clause) без SPDX в GitHub Dependency Graph:
          allow-dependencies-licenses: pkg:githubactions/subosito/flutter-action, pkg:pub/fake_async, pkg:pub/matcher
