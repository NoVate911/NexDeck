name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run full verification suite
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Package release archive
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          $staging = "dist/nexdeck-$tag-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item target/release/nexdeck-agent.exe $staging/
          Copy-Item target/release/nexdeck-desktop.exe $staging/
          Copy-Item LICENSE, README.md, CHANGELOG.md $staging/
          $archive = "dist/nexdeck-$tag-windows-x86_64.zip"
          Compress-Archive -Path "$staging/*" -DestinationPath $archive -Force
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  nexdeck-$tag-windows-x86_64.zip" | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@v7
        with:
          name: nexdeck-windows-x86_64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
