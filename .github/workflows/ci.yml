name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check-and-lint:
    name: Check & Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace targets
        run: cargo check --workspace --all-targets --locked
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  unit-tests:
    name: Unit Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run unit tests
        run: cargo test --workspace --lib --locked

  integration-tests:
    name: Integration & Doc Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run integration tests
        run: cargo test --workspace --tests --locked
      - name: Run doctests
        run: cargo test --workspace --doc --locked

  docs:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build documentation without warnings
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --locked

  build:
    name: Release Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --workspace --release --locked
      - name: Smoke test binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./target/release/nexdeck-agent.exe --version
          ./target/release/nexdeck-desktop.exe --version
      - name: Smoke test binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          ./target/release/nexdeck-agent --version
          ./target/release/nexdeck-desktop --version

  mobile:
    name: Mobile Client (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - name: Check Dart formatting
        working-directory: apps/mobile
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze Flutter code
        working-directory: apps/mobile
        run: flutter analyze --fatal-infos
      - name: Run Flutter tests
        working-directory: apps/mobile
        run: flutter test

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [format, check-and-lint, unit-tests, integration-tests, docs, build, mobile]
    if: always()
    steps:
      - name: Verify all required CI jobs passed
        run: |
          if [ "${{ needs.format.result }}" != "success" ] || \
             [ "${{ needs.check-and-lint.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-tests.result }}" != "success" ] || \
             [ "${{ needs.docs.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.mobile.result }}" != "success" ]; then
            echo "One or more CI jobs failed:"
            echo "format=${{ needs.format.result }}"
            echo "check-and-lint=${{ needs.check-and-lint.result }}"
            echo "unit-tests=${{ needs.unit-tests.result }}"
            echo "integration-tests=${{ needs.integration-tests.result }}"
            echo "docs=${{ needs.docs.result }}"
            echo "build=${{ needs.build.result }}"
            echo "mobile=${{ needs.mobile.result }}"
            exit 1
          fi
