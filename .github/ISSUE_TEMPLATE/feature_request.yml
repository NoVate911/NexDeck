name: Предложение новой функции (Feature Request)
description: Предложить новую возможность, виджет, API или улучшение
title: "feat(<scope>): <краткое описание>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Проверьте, как предложение соотносится с архитектурой NexDeck и ограничениями потребления ресурсов.
  - type: dropdown
    id: component
    attributes:
      label: Целевой компонент
      options:
        - core
        - transport
        - monitoring
        - plugin_engine
        - api
        - notifications
        - approval
        - desktop
        - mobile
        - sdk
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу решает?
      description: Опишите сценарий использования или текущее ограничение.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Предлагаемое решение
      description: Опишите желаемое поведение, API или интерфейс.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Влияние на производительность и безопасность
      description: Оценка влияния на RAM/CPU, разрешения и обратную совместимость.
