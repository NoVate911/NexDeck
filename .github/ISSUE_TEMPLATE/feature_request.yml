name: Feature Request
description: Propose a new capability, widget, plugin API, or enhancement
title: "feat(<scope>): <short description>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please verify how your proposal aligns with the NexDeck Technical Specification (`TZ.md`) and resource efficiency goals.
  - type: dropdown
    id: component
    attributes:
      label: Target Component
      options:
        - core
        - transport
        - monitoring
        - plugin_engine
        - api
        - notifications
        - approval
        - desktop
        - mobile
        - sdk
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What limitation or use case does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the desired behavior, API contract, or UI experience.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Performance, Security, or Compatibility Considerations
      description: Impact on idle RAM/CPU, permissions, or backward compatibility.
