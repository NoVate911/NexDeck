name: Документация (Documentation Issue)
description: Сообщить о неточности, пробеле или улучшении в документации
title: "docs(<scope>): <краткое описание>"
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Файл или раздел
      placeholder: "например: README.md, docs/api/universal-api.md"
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Что нужно поправить или дополнить?
      description: Укажите, чего не хватает или что описано неточно.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Предлагаемый вариант (опционально)
      description: Примеры, формулировки или идеи схем.
