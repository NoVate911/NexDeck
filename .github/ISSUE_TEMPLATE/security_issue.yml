name: Улучшение безопасности (Security Hardening)
description: Задача по усилению безопасности или политик (НЕ публикуйте здесь реальные уязвимости)
title: "security(<scope>): <краткое описание>"
labels: ["security"]
body:
  - type: markdown
    attributes:
      value: |
        > **ВАЖНО:** Никогда не публикуйте рабочие уязвимости, эксплойты или утечки секретов в публичных Issues!
        > Используйте **GitHub Private Vulnerability Reporting** (`Security -> Advisories -> Report a vulnerability`), см. `SECURITY.md`.
        >
        > Этот шаблон предназначен только для публичных задач по укреплению защиты и политик безопасности.
  - type: dropdown
    id: area
    attributes:
      label: Область безопасности
      options:
        - Аутентификация и токены API
        - Remote Approval и защита от повтора
        - Песочница и квоты плагинов
        - Шифрование транспорта и сопряжение
        - Проверки CI и аудит зависимостей
        - Документация / модель угроз
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Описание улучшения
      description: Опишите сценарий угрозы, область воздействия и предлагаемую меру защиты.
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Подтверждение
      options:
        - label: Подтверждаю, что задача не раскрывает активный эксплойт, секреты или 0-day уязвимость.
          required: true
