name: Сообщение об ошибке (Bug Report)
description: Сообщить о дефекте или некорректной работе NexDeck
title: "fix(<scope>): <краткое описание>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт! Перед отправкой убедитесь, что похожей задачи ещё нет, и не прикладывайте секреты, токены или реальные ключи.
  - type: dropdown
    id: component
    attributes:
      label: Компонент
      options:
        - core
        - transport
        - monitoring
        - plugin_engine
        - api
        - notifications
        - approval
        - desktop
        - mobile
        - ci / build
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия NexDeck или хэш коммита
      placeholder: "например: 0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Окружение
      placeholder: "например: Windows 11 24H2 / Android / iOS"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Что произошло?
      description: Опишите фактическое и ожидаемое поведение.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Шаги воспроизведения
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи или вывод ошибки
      render: text
