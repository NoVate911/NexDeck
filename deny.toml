[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
ignore = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
]
skip = [
    { crate = "base64@0.22.1", reason = "tungstenite/axum use base64 0.22 while rcgen 0.14.10 uses 0.23" },
    { crate = "getrandom@0.2.17", reason = "ring 0.17 depends on getrandom 0.2" },
]
skip-tree = [
    { crate = "windows-sys", reason = "tokio/socket2/ring use 0.52 while monitoring uses 0.61" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
exceptions = []
