[package]
name = "nexdeck-core"
description = "Headless Core Agent runtime and subsystem orchestration for NexDeck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nexdeck-agent"
path = "src/main.rs"

[dependencies]
nexdeck-api.workspace = true
nexdeck-approval.workspace = true
nexdeck-monitoring.workspace = true
nexdeck-notifications.workspace = true
nexdeck-plugin-engine.workspace = true
nexdeck-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
